[build-system]
requires = ["setuptools>=69,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-figures"
version = "1.0.0"
description = "Reliable publication-figure project scaffolding, rendering, export, and validation."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Taxueovo" }]
keywords = ["academic", "figures", "matplotlib", "publication", "visualization"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
  "matplotlib>=3.7,<4",
  "numpy>=1.24,<3",
  "pandas>=1.5,<4",
  "Pillow>=9,<13",
  "pypdf>=5,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
paper-figures = "paper_figures.cli:entrypoint"

[project.urls]
Homepage = "https://github.com/Taxueovo/paper-figures"
Issues = "https://github.com/Taxueovo/paper-figures/issues"
Repository = "https://github.com/Taxueovo/paper-figures"

[tool.setuptools.packages.find]
include = ["paper_figures*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH", "RUF"]
